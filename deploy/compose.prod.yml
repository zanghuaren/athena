# Keep the existing project name and volumes when switching from compose.dev.yml.
name: athena-dev

x-server: &server
  image: athena-dev-server
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=128m,mode=1777
  env_file:
    - path: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://athena:athena@db:5432/athena
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ../server:/app:ro
    - files-data:/data/files
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, athena]
      interval: 2s
      retries: 15

  api:
    <<: *server
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 3s
      retries: 20

  worker:
    <<: *server
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    user: "10001:10001"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:5173:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  files-data:

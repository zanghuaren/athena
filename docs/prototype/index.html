<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雅典娜 · 可点击原型</title>
<style>
/* 视觉沿用旧项目雅典娜设计稿（reference/eduagent/指导/前端设计/雅典娜美化方案.html）的色彩变量与组件 */
:root{--paper:#f6f2eb;--surface:#fdfbf5;--surface-alt:#eee8df;--ink:#26201a;--muted:#6e6459;--line:#ded6c9;--clay:#a84d30;--clay-tint:#f2e2d7;--olive:#606a4e;--olive-tint:#e8ebdf;--ochre:#9a6b1f;--canvas:#e9e4db;--soft:#786a5a;--danger:#a33332;--danger-tint:#f5e6e3;--focus:#8f442b;--serif:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;--sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--latin:"Baskerville","Palatino Linotype","Book Antiqua",serif;--shadow:0 16px 50px #4c382611;color-scheme:light}
[data-theme="dark"]{--paper:#211d18;--surface:#2a251f;--surface-alt:#352e25;--ink:#eee7db;--muted:#b8ab98;--line:#4b4033;--clay:#e09a77;--clay-tint:#493127;--olive:#b1ba99;--olive-tint:#373d2c;--ochre:#d6a75a;--canvas:#181511;--soft:#b0a18b;--danger:#f0a09a;--danger-tint:#482b29;--focus:#efb08f;--shadow:0 16px 50px #0002;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink)}
body{font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
svg.icon{display:block;flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 评审外框：左目录 · 中舞台 · 右说明 */
#app{--index-width:220px;--notes-width:260px;display:grid;grid-template-columns:var(--index-width) minmax(0,1fr) var(--notes-width);grid-template-rows:52px minmax(0,1fr);height:100dvh}
#app.index-hidden{--index-width:0px}#app.notes-hidden{--notes-width:0px}
#index{grid-column:1;grid-row:2}#stage{grid-column:2;grid-row:2}#notes{grid-column:3;grid-row:2}
#app.index-hidden #index,#app.notes-hidden #notes{display:none}
#review-toolbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--paper);z-index:11}
#review-toolbar .muted{margin-right:auto}#review-toolbar button{padding:6px 12px;min-height:36px;border:1px solid var(--line);border-radius:6px;font-size:12px}
#index,#notes{background:var(--paper);overflow-y:auto;padding:22px 18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#index{border-right:1px solid var(--line)}
#notes{border-left:1px solid var(--line)}
.ctl-label{font-size:11px;letter-spacing:.12em;color:var(--soft);margin:14px 0 6px}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ends button,.states button{min-height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;color:var(--muted)}
.ends button.on,.states button.on{background:var(--clay-tint);border-color:color-mix(in srgb,var(--clay) 40%,transparent);color:var(--clay);font-weight:600}
.exp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}
.exp input{accent-color:var(--clay)}
.group{font-size:11px;letter-spacing:.12em;color:var(--soft);margin:18px 0 4px;padding-left:8px}
.pl{display:flex;width:100%;text-align:left;padding:5px 8px;border-radius:6px;font-size:13px;color:var(--muted);gap:8px}
.pl:hover{color:var(--clay)}
.pl.on{background:var(--clay-tint);color:var(--clay);font-weight:600}
.pl .id{width:34px;flex:none;font:11px/21px var(--latin);color:var(--soft)}
#stage{overflow:auto;display:flex;align-items:flex-start;padding:20px;min-width:0}
#stage>.phone,#stage>.web{margin:0 auto}
#notes h2{font:20px/1.5 var(--serif);font-weight:600;margin:0 0 2px}
#notes .meta{font-size:12px;color:var(--muted);margin-bottom:16px}
#notes p{margin:6px 0;font-size:13px;color:var(--muted);line-height:1.8}
#notes .ico{display:block;padding:3px 0}
.states{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 16px}

/* 设备 */
.phone{width:390px;max-width:100%;height:812px;flex:none;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--paper);box-shadow:var(--shadow)}
.web{container:workspace / inline-size;width:100%;min-width:0;max-width:1320px;height:812px;display:grid;grid-template-columns:184px minmax(0,1fr);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--shadow)}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.full{flex:1;overflow-y:auto;padding:24px 22px}
.topbar{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 18px;border-bottom:1px solid var(--line);flex:none}
.web .topbar{padding:0 32px;min-height:63px}
.topbar .t{flex:1;margin:0;font-size:16px;font-weight:600;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;overflow-y:auto;padding:20px 20px 28px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.web .content{padding:24px 28px 32px}
.web .content>.read{max-width:820px;margin:0 auto}
.tabs{display:flex;border-top:1px solid var(--line);padding:4px 8px 8px;background:var(--paper);flex:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;font-size:11px;color:var(--muted)}
.tabs button.on{color:var(--clay)}
.tabs button:hover{color:var(--clay)}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:28px 18px 16px;background:color-mix(in srgb,var(--paper) 86%,var(--surface-alt));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 3px 26px;color:var(--clay)}
.brand svg{width:30px;height:34px}
.brand strong{display:block;font:19px/1.4 var(--serif);letter-spacing:.08em;color:var(--ink)}
.brand span{font:9px var(--latin);letter-spacing:.25em;color:var(--muted)}
.new-chat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;border:1px solid var(--line);border-radius:7px;margin-bottom:22px;font-size:13px;background:var(--surface)}
.new-chat:hover{border-color:var(--clay);color:var(--clay)}
.new-chat svg{width:16px;height:16px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;text-align:left;padding:8px 12px;border-radius:7px;color:var(--muted);font-size:13px;margin-bottom:4px}
.nav svg{width:18px;height:18px}
.nav:hover{color:var(--clay)}
.nav.on{background:var(--clay-tint);color:var(--clay);font-weight:600}
.nav .count{margin-left:auto;font-size:11px;font-weight:400;opacity:.65}
.side .sub{color:var(--soft);font-size:11px;letter-spacing:.12em;padding:18px 12px 6px}
.side .recent{display:block;width:100%;text-align:left;font-size:12px;padding:5px 12px;color:var(--muted)}
.side .recent:hover{color:var(--clay)}
.side-note{margin:auto 10px 14px;padding-top:24px}
.side-note svg{width:64px;height:32px;fill:none;stroke:var(--olive);stroke-width:1.1;stroke-linecap:round}
.side-note p{font:12px/1.85 var(--serif);letter-spacing:.1em;color:var(--muted);margin:4px 0}
.side-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;font-size:12px}
.side-foot span{display:block;color:var(--muted);font-size:10px}
.avatar{width:32px;height:32px;flex:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font:14px var(--serif);color:var(--clay);background:var(--surface)}
.avatar.lg{width:58px;height:58px;font-size:24px}
.expbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 18px;background:var(--olive-tint);color:var(--olive);font-size:12px;flex:none}
.expbar button{border:1px solid color-mix(in srgb,var(--olive) 50%,transparent);border-radius:5px;padding:2px 10px;font-size:12px;color:var(--olive)}

/* 页头：沿用旧稿 section-top（拉丁小标签 + 宋体标题） */
.section-top{margin:0 0 16px}
.eyebrow{display:block;font:10px/14px var(--latin);letter-spacing:.17em;text-transform:uppercase;color:var(--clay);margin-bottom:10px}
.section-top h2{font:500 25px/40px var(--serif);letter-spacing:.06em;margin:0}
.section-top p{font-size:13px;color:var(--muted);margin:6px 0 0}
.hero{position:relative;min-height:200px;display:flex;align-items:center;padding:10px 0 18px;overflow:hidden}
.hero-copy{position:relative;z-index:1;max-width:66%}
.hero h2{margin:0;font:500 28px/1.55 var(--serif);letter-spacing:.08em}
.hero h2 span{display:block}
.hero p{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.85}
.hero img{position:absolute;right:-40px;top:0;width:300px;height:200px;object-fit:cover;object-position:88% center;mix-blend-mode:multiply;mask-image:linear-gradient(to right,transparent 0%,#000 28%,#000 88%,transparent 100%);opacity:.88;pointer-events:none}
.web .hero img{width:380px;height:240px;right:-20px}
.web .hero{min-height:240px}
[data-theme="dark"] .hero img{mix-blend-mode:screen;filter:grayscale(.6) sepia(.45) brightness(.74);opacity:.38}
.meander{height:10px;width:100%;color:var(--line);display:block}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0 12px;color:var(--soft);font-size:11px;letter-spacing:.06em}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}

/* 对话 */
.me{display:flex;justify-content:flex-end;margin:0 0 20px}
.me div{max-width:86%;padding:11px 16px;border-radius:12px 12px 3px 12px;background:var(--surface-alt)}
.ai{margin:0 0 20px}
.ai-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--clay)}
.ai-head svg{width:19px;height:22px;stroke-width:1.2}
.ai-head span{font:11px var(--latin);letter-spacing:.14em}
.ai h3{margin:0 0 14px;font:600 20px/1.5 var(--serif)}
.steps{display:grid;gap:14px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.step-number{color:var(--clay);font:13px/24px var(--latin);width:24px;height:24px;text-align:center;border:1px solid color-mix(in srgb,var(--clay) 40%,transparent);border-radius:50%;margin-top:1px}
.step h4{font-size:14px;font-weight:600;margin:0 0 3px}
.step p{font-size:14px;line-height:1.9;margin:0;color:var(--muted)}
.step.dim .step-number{color:var(--soft);border-color:var(--line)}
.step.dim h4,.step.dim p{color:var(--soft)}
.math{font-family:var(--latin);font-style:italic;letter-spacing:.02em}
.result{margin:12px 0 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:4px 14px;margin:14px 0 4px}
.dock{border-top:1px solid var(--line);padding:10px 16px 8px;background:var(--paper);flex:none}
.web .dock{padding:10px 28px}
.web .dock>div{max-width:820px;margin:0 auto}
.tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:0 -6px 8px}
.tool{display:flex;align-items:center;gap:6px;min-height:34px;padding:3px 9px;color:var(--muted);font-size:12px;border-radius:5px}
.tool:hover{background:var(--surface-alt);color:var(--clay)}
.tool svg{width:15px;height:15px}
.tools .note{font-size:11px;color:var(--soft);margin-left:auto}
.composer{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:8px 12px;align-items:end;padding:12px 10px 10px 12px;border:1px solid var(--soft);border-radius:10px;background:var(--surface)}
.composer .ph-text{grid-column:1/-1;color:var(--soft);font-size:15px;min-height:30px}
.composer .attach{color:var(--muted);width:36px;height:36px;display:grid;place-items:center}
.composer .send{width:42px;height:42px;display:grid;place-items:center;border-radius:7px;background:var(--clay);color:var(--surface)}
.composer .send svg{width:18px;height:18px}
.caption{font-size:12px;color:var(--soft);margin-top:4px}

/* 通用组件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 15px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:13px}
.btn:hover{border-color:var(--clay);color:var(--clay)}
.btn.pri{background:var(--clay);border-color:var(--clay);color:var(--surface)}
.btn.pri:hover{background:color-mix(in srgb,var(--clay) 85%,var(--ink));color:var(--surface)}
.btn.sm{min-height:32px;padding:3px 11px;font-size:12px}
.btn.block{display:flex;width:100%;margin:10px 0;min-height:46px}
.btn.ghost{border-style:dashed}
.ico{color:var(--clay);font-size:13px;white-space:nowrap}
.ico:hover{text-decoration:underline;text-underline-offset:4px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0;background:var(--surface)}
.box.gray{background:var(--surface-alt);border-color:transparent}
.box.err{background:var(--danger-tint);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.box.err b{color:var(--danger);font-weight:600}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--soft);font-size:12px;border-radius:8px;margin:8px 0;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--surface-alt) 0 10px,color-mix(in srgb,var(--surface-alt) 60%,var(--paper)) 10px 20px)}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;padding:8px 12px;min-height:40px;color:var(--soft);background:var(--surface);margin:4px 0}
.in.area{min-height:80px;align-items:flex-start}
.in.filled{color:var(--ink)}
.lab{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted);font-size:12px}
.h{font:600 16px/1.6 var(--serif);margin:24px 0 8px;letter-spacing:.04em}
.big{font:500 26px/1.5 var(--serif);letter-spacing:.04em}
.num{font-family:var(--latin);font-variant-numeric:lining-nums}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:3px 13px;border-radius:5px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--surface)}
.chip.on{background:var(--clay);border-color:var(--clay);color:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:2px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.filters .chip{border-color:transparent;background:none}
.filters .chip.on{background:var(--clay);color:var(--surface)}
.seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:7px;gap:2px;margin:6px 0}
.seg button{flex:1;min-height:34px;padding:3px 10px;font-size:12px;color:var(--muted);border-radius:4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #3f2b1711;font-weight:600}
.li{display:block;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line)}
.li[data-go]{cursor:pointer}
.li[data-go]:hover .lt{color:var(--clay)}
.li .lt{font-size:14px}
.li .s{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:4px;background:var(--surface-alt);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive)}
.bar.weak i{background:var(--clay)}
.bar.mid i{background:var(--ochre)}
.kp{display:grid;grid-template-columns:minmax(0,1fr) 110px 68px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.kp:hover>span:first-child{color:var(--clay)}
.kp .lv{font-size:12px;text-align:right}
.lv.weak{color:var(--clay)}.lv.mid{color:var(--ochre)}.lv.good{color:var(--olive)}.lv.none{color:var(--soft)}
.stats{display:grid;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0}
.stats>div{padding:12px 10px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:400 24px/1.3 var(--latin);color:var(--ink)}
.stats span{font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:left}
th{color:var(--soft);font-weight:500;font-size:12px}
th:first-child,td:first-child{padding-left:0}
tr.click{cursor:pointer}
tr.click:hover td{color:var(--clay)}
.heat{display:grid;grid-template-columns:110px repeat(6,1fr);gap:4px;font-size:12px;align-items:center;margin:8px 0}
.heat i{display:block;height:26px;border-radius:3px}
.modal{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface);margin:12px 0;box-shadow:0 18px 50px #4c382626}
.modal b{font:600 16px var(--serif)}
.center{text-align:center}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:4px;font-weight:400}
.q{margin:14px 0;padding:8px 12px;border:1px dashed color-mix(in srgb,var(--olive) 60%,transparent);border-radius:6px;background:var(--olive-tint);color:var(--olive);font-size:12px;line-height:1.7}
.ok{color:var(--olive)}.bad{color:var(--danger)}.warn{color:var(--ochre)}
.quote{font:13px/1.9 var(--serif);color:var(--muted);letter-spacing:.08em;text-align:center;margin:26px 0 6px}

/* 今日：沿用旧“学习计划”页 */
.plans-intro{display:flex;gap:15px;align-items:center;padding:14px 0 20px;border-bottom:1px solid var(--line)}
.plan-date{width:54px;height:62px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--clay);font-family:var(--latin);background:var(--surface)}
.plan-date strong{font-size:27px;line-height:1.2;font-weight:400}
.plan-date span{font-size:9px;letter-spacing:.15em}
.plans-intro h3{font-size:14px;font-weight:500;margin:0 0 3px}
.plan{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.plan-icon{width:35px;height:35px;flex:none;display:grid;place-items:center;color:var(--olive);border:1px solid var(--line);border-radius:50%}
.plan-icon svg{width:17px;height:17px}
.plan.done{opacity:.55}
.plan-copy{flex:1;min-width:0}
.plan-copy strong{font-size:14px;font-weight:500}
.plan-copy p{font-size:12px;color:var(--muted);margin:3px 0 0}

/* 错题本：沿用旧 mistake-item */
.mistake{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.subject{font-size:12px;color:var(--clay);margin:0 0 6px;letter-spacing:.06em}
.mistake h3{font-size:15px;font-weight:500;margin:0 0 5px;line-height:1.85;cursor:pointer}
.mistake h3:hover{color:var(--clay)}
.mistake .exp-t{font-size:13px;color:var(--muted);margin:0;line-height:1.8}
.status{font-size:11px;color:var(--muted);text-align:right}
.status strong{display:block;font:400 22px/1.3 var(--latin);color:var(--olive)}
.review-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin:0 0 16px;border-radius:10px;background:var(--olive-tint);color:var(--olive)}
.review-strip b{font:400 22px var(--latin)}

/* 复习：沿用旧翻卡 */
.rv-progress{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-bottom:10px}
.rv-progress strong{font:20px var(--latin);color:var(--ink);font-weight:400}
.rv-line{height:3px;background:var(--surface-alt);margin-bottom:24px}
.rv-line span{display:block;height:100%;background:var(--olive)}
.rv-card{position:relative;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:28px 24px 22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;width:100%}
.rv-card.flipped{background:var(--olive-tint)}
.rv-card .card-type{font:11px var(--latin);letter-spacing:.12em;color:var(--clay)}
.rv-card .card-q{font:22px/1.8 var(--serif);letter-spacing:.04em}
.rv-card .card-hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.rv-card .card-hint svg{width:14px;height:14px}
.rv-card .card-no{position:absolute;right:18px;top:18px;font:10px var(--latin);color:var(--soft)}
.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.rating{display:flex;justify-content:center;align-items:center;gap:6px;min-height:46px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12px}
.rating:hover{border-color:var(--clay);color:var(--clay)}
.rating:last-child{border-color:var(--olive);color:var(--olive)}
.rating svg{width:16px;height:16px}
.hint-line{text-align:center;color:var(--muted);font-size:12px;margin:16px 0 0}

/* 我的：沿用旧 profile */
.profile-hero{display:flex;align-items:center;gap:16px;padding:6px 0 22px;border-bottom:1px solid var(--line)}
.profile-hero b{display:block;font:500 20px var(--serif);letter-spacing:.06em}
.group-t{font-size:11px;letter-spacing:.12em;color:var(--soft);margin:24px 0 0}
.plink{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line)}
.plink:hover .lt{color:var(--clay)}
.plink .lt{font-size:14px}
.plink .s{font-size:12px;color:var(--muted)}
.plink>svg{margin-left:auto;width:14px;color:var(--soft)}
.plink .pi{color:var(--olive);width:18px}
/* 复核在手机上按学生、原图、评分顺序阅读 */
.review-layout{display:grid;grid-template-columns:140px minmax(0,1fr) 300px;gap:20px;min-height:640px}
.review-layout>div{min-width:0}
.phone .review-layout{display:flex;flex-direction:column;gap:16px;min-height:0}
.phone .review-students{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px}
.phone .review-students .li{flex:0 0 auto;width:auto;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
.phone .review-original .ph{height:260px!important}
.phone .review-score .h{margin-top:0}
.phone .review-score .row{position:sticky;bottom:-28px;background:var(--paper);padding:12px 0}
.phone .grid3.review-by-question{grid-template-columns:1fr}
.answer-sheet{padding:22px;border:1px solid var(--line);border-radius:8px;background:var(--surface);line-height:1.9;min-height:320px}
.answer-sheet h3{font:600 20px var(--serif)}
.triangle{display:block;width:100%;max-width:280px;height:180px;margin:10px auto;color:var(--olive)}
.handwriting{font:italic 20px/1.8 var(--latin),var(--serif);padding-top:16px;border-top:1px solid var(--line)}
.scoring-guide{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:7px}.scoring-guide summary{cursor:pointer;font-weight:600}
.review-students .selected{color:var(--clay);background:var(--clay-tint)}
.review-score .in,.review-by-question .in{width:100%;font:inherit;color:var(--ink)}
.review-footer{background:var(--paper);padding:12px 0}.phone .review-footer{position:sticky;bottom:-28px}
.knowledge-row{display:grid;width:100%;grid-template-columns:minmax(160px,1fr) minmax(80px,180px) 100px 20px;align-items:center;gap:16px;text-align:left;padding:18px 0;border-bottom:1px solid var(--line)}
.knowledge-row small{display:block;color:var(--muted);margin-top:4px}.phone .knowledge-row{grid-template-columns:minmax(0,1fr) 80px 20px;gap:10px}.phone .knowledge-row .bar{display:none}
.answer-dialog{width:min(90vw,700px);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}.answer-dialog::backdrop{background:#0008}

.study-card{display:block;padding:18px 0}.study-card h3{font-size:16px}.study-card .status{margin-top:10px;font-size:12px;text-align:left;color:var(--muted)}
.study-card .actions{margin:10px 0}.study-card .status:before{content:"复习状态："}
.phone .review-layout .answer-sheet{min-height:0;padding:16px}.phone .review-layout .triangle{height:135px}
@container workspace (max-width:1100px){
  .review-layout{grid-template-columns:minmax(0,1fr) 260px;gap:16px}
  .review-students{grid-column:1/-1;display:flex;gap:8px;overflow:auto}
  .review-students .li{width:auto;flex:none;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
  .review-by-question{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container workspace (max-width:740px){
  .review-layout{grid-template-columns:minmax(0,1fr)}
  .review-by-question{grid-template-columns:minmax(0,1fr)}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.table-wrap{width:100%;overflow-x:auto}table th,table td{overflow-wrap:anywhere}
.phone .grid3:not(.review-by-question){grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .review-by-question{grid-template-columns:minmax(0,1fr)}
button,input,textarea,select,summary,[tabindex]{touch-action:manipulation}
input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@media(max-width:760px){
  #app{grid-template-columns:0 minmax(0,1fr) 0}
  #index,#notes{position:fixed;top:52px;bottom:0;width:min(280px,85vw);z-index:10;box-shadow:var(--shadow)}
  #index{left:0}#notes{right:0}
  #stage{padding:0}
  #review-toolbar{padding:6px 8px;gap:4px}#review-toolbar .muted{display:none}#review-toolbar button{flex:1;padding:6px}
  .phone{width:100%;max-width:430px;height:calc(100dvh - 52px);border-radius:0;border:0;box-shadow:none}
  .web{height:calc(100dvh - 52px);border-radius:0;grid-template-columns:120px minmax(0,1fr)}
  .web .side{padding:16px 8px}.web .nav{padding:8px;gap:6px}.web .nav svg{display:none}.web .content{padding:16px}
}

.in{width:100%;font:inherit;color:var(--ink);resize:vertical}.in::placeholder{color:var(--soft);opacity:1}
textarea.in{display:block;line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:4px}.chips .chip{margin:0}
.composer{display:flex;align-items:flex-end;gap:8px;padding:7px 8px;min-height:52px}
.composer textarea{flex:1;min-width:0;min-height:36px;max-height:112px;resize:none;border:0;background:transparent;color:var(--ink);font:15px/24px var(--sans);padding:6px 0}
.composer textarea::placeholder{color:var(--soft)}.composer .send{width:36px;height:36px;flex:none}.dock .tools{margin-bottom:5px}
.message-text{white-space:pre-wrap;font-size:15px;line-height:1.9;margin:0}
.mode-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px}
.answer-options{padding:0;margin:0;border:0}.answer-options input{accent-color:var(--clay);width:18px;height:18px;vertical-align:middle}.answer-options label{cursor:pointer}
.history-row{display:flex;align-items:center;gap:12px}.history-row[hidden],[hidden]{display:none!important}
#status{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;box-shadow:var(--shadow);max-width:90vw;pointer-events:none}#status:empty{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[data-reduced-motion="true"] *{transition:none!important;animation:none!important}
.plan.done{opacity:1;color:var(--muted)}

.question-link{text-align:left;line-height:1.9;width:100%}.question-link:hover{color:var(--clay)}.question-heading{font:500 20px/1.8 var(--serif);margin:12px 0 20px}
.mistake-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.mistake-filters label{font-size:12px;color:var(--muted)}.mistake-filters select{display:block;width:100%;min-width:0;margin-top:4px}
.empty-state{margin:32px 0}.ratings .rating{flex-direction:column;gap:2px;padding:8px 4px}.rating span{font-size:12px;color:var(--muted)}
.result-question{padding:14px 0;border-bottom:1px solid var(--line)}.result-question summary{cursor:pointer}.result-question p{font-size:14px;line-height:1.8}
.answer-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:8px}.answer-grid .chip{justify-content:center;margin:0;min-height:40px}
#status button{pointer-events:auto;text-decoration:underline;margin-left:12px}
</style>

const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = n => `<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-${n}"/></svg>`;
const go = (id, label, cls = '') => `<button class="btn ${cls}" data-go="${id}">${label}</button>`;
const pri = (id, label, extra = '') => go(id, label, 'pri ' + extra);
const ico = (id, label) => `<button class="ico" data-go="${id}">${label}</button>`;
const ph = (label, h = 120) => `<div class="ph" style="height:${h}px">${label}</div>`;
let fieldIndex=0, pendingLabel='';
const inp = (t, area, filled) => {
  const label=pendingLabel||t||'填写内容';pendingLabel='';
  const key=S.page+':'+S.state+':'+(S.page==='S-20'?S.answerSource+':':'')+fieldIndex++, id='field-'+fieldIndex;
  const value=S.fields[key]??(filled?t:'');
  const attrs=`id="${id}" class="in ${area?'area':''}" data-field="${key}" aria-label="${escapeHTML(label)}" placeholder="${escapeHTML(filled?'':t)}"`;
  return area?`<textarea ${attrs}>${escapeHTML(value)}</textarea>`:`<input ${attrs} type="${label.includes('密码')?'password':'text'}" value="${escapeHTML(value)}" autocomplete="off">`;
};
const val = (t, area) => inp(t, area, true);
const lab = t => {pendingLabel=t;return `<div class="lab">${t}</div>`};
function choices(arr,on,kind,gos=[]) {

function exerciseQuestion(index=S.exerciseIndex) {
  const topic=S.exerciseTopic,type=S.answerSource==='homework'&&index===2?'解答题':index%2===0?'选择题':'解答题',n=S.answerSource==='homework'?[2,3,1,4,5,6,7,8,9,10][index]:index+1;
  if(topic===1) {const volume=n*100,answer=String(n);return {type,q:`物体排开水 ${volume} cm³，水的密度为 1 g/cm³，g 取 10 N/kg。浮力是多少 N？`,options:[n+1,n,n+2,n+3].map(String),correct:1,answer,solution:`F浮 = ρ液 g V排 = ${n} N。`};}
  if(topic===2) {const names=['I','We','They'],period=index%2===0;return {type,q:`${names[index%3]} have lived here ___ ${period?n+' years':'2020'}. 填写 for 或 since。`,options:['since','for','at','on'],correct:1,answer:period?'for':'since',solution:period?'for 接时间段。':'since 接时间起点。'};}
  if(topic===3) {const a=n+1,b=n+2;return {type,q:`解方程 x² − ${a+b}x + ${a*b} = 0。`,options:[`${a-1} 或 ${b}`,`${a} 或 ${b}`,`${a} 或 ${b+1}`,'无解'],correct:1,answer:`${a} 或 ${b}`,solution:`因式分解为 (x − ${a})(x − ${b}) = 0。`};}
  if(topic===5){return {type,q:`化简 ${n}√12 + √27。`,options:[`${n+3}√3`,`${2*n+3}√3`,`${n+3}√39`,'√39'],correct:1,answer:`${2*n+3}√3`,solution:`√12 = 2√3，√27 = 3√3，合并系数得 ${2*n+3}√3。`};}
  const a=3*n,b=4*n,c=5*n;
  if(topic===4)return {type,q:`三边长为 ${a}、${b}、${c} 的三角形是否为直角三角形？`,options:['不是','是','无法判断','等边三角形'],correct:1,answer:'是',solution:`${a}² + ${b}² = ${c}²，满足勾股定理的逆定理。`};

function answerSheet(student) {

function reviewScore(index, compact=false) {
  const x=REVIEW[index];
  return `<section class="box ${x.reviewed?'':'err'}" data-review-row="${index}"><b>${x.name} · ${x.reviewed?'已复核':x.score===null?'需人工批改':'AI 待核对'}</b><p>${x.reason}</p>
    ${compact?answerSheet(x):''}<label class="lab" for="review-score-${index}">第 3 题得分（0～8 分）</label><input class="in" id="review-score-${index}" data-review-score="${index}" type="number" min="0" max="8" step="1" value="${x.score??''}" placeholder="请输入人工评分">
    <label class="lab" for="review-comment-${index}">评语</label><textarea class="in area" id="review-comment-${index}" data-review-comment="${index}">${escapeHTML(x.comment)}</textarea>
    <p class="muted">总分 <b data-review-total="${index}">${x.score===null?'待给分':x.base+x.score}</b> / 100 · ${x.published?'已发布':x.reviewed?'已保存复核':'未确认复核'}</p>
    ${compact?`<button class="btn" data-save-review="${index}">${x.reviewed?'保存修改':'保存复核'}</button>`:''}</section>`;
}

  if(id==='S-16'&&!st&&!dueItems().length){S.page=id;S.state='无到期';render();return}
  if(id==='S-20'&&S.page!=='S-20'&&S.page!=='S-03') {
    S.answerSource=S.page==='S-10'?'homework':'practice';S.exerciseIndex=0;S.exerciseAnswers={};S.exerciseAttachments={};S.handwritten=false;
    S.exerciseTopic=S.page==='S-10'?0:S.page==='S-19'?S.practiceTopic:S.topic;
    S.exerciseTotal=S.page==='S-10'?activeHomework().count:S.page==='S-19'?S.practiceCount:1;
  }
  if((id==='S-14'||id==='S-01')&&['S-12','S-06'].includes(S.page)) {S.topic=0;S.messages=[];S.guideStep=0;}
  if (id === 'S-10' && st === '已提交' && S.homework === 'main') S.homeworkSubmitted = true;
  if (id === 'S-10' && S.homework === 'main' && REVIEW[0].published) { S.page=id; S.state='已发布'; render(); return; }
  if (id === 'S-12' || (id === 'S-14' && S.page === 'S-12')) S.homework = S.homework || 'main';
  if(id==='S-01'&&st==='直接讲解')S.chatMode='direct';
  if(id==='S-01'&&st==='引导式对话中')S.chatMode='guided';
  if(id==='S-01'&&st==='空状态'){S.messages=[];S.guideStep=0;}
  if(id==='T-21'&&st==='空状态')S.teacherMessages=[];
  S.page = id; S.state = st || (id === 'S-10' && S.homework==='main' && S.homeworkSubmitted ? '已提交' : null);
  render();
}
function setRole(r) {
  S.role = r;
  if (r === 's' && !S.end.startsWith('s')) S.end = isPhone() ? 'sp' : 'sw';
  if (r === 't' && !S.end.startsWith('t')) S.end = isPhone() ? 'tp' : 'tw';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-back],[data-state],[data-end],[data-login],[data-exp],[data-expdone],[data-switch],[data-theme-set],[data-capture],[data-submit-answer],[data-hw-filter],[data-review-student],[data-save-review],[data-publish],[data-confirm-publish],[data-knowledge],[data-zoom-answer],[data-panel],[data-preview],[data-choice],[data-send-chat],[data-chat-topic],[data-chat-action],[data-history-edit],[data-save-profile],[data-feedback],[data-mistake-subject],[data-add-mistake],[data-add-manual],[data-master-mistake],[data-remove-mistake],[data-undo-mistake],[data-save-note],[data-rate-review],[data-start-practice],[data-question-move],[data-question-jump]');
  if (!t) return;
  const d = t.dataset;
  if(d.mistakeSubject){S.mistakeSubject=d.mistakeSubject;render();}
  else if(d.addMistake){const x=MISTAKES.find(x=>x.topic===S.topic);x.removed=false;nav('S-13');announce('错题已保留在本中，复习进度未重置');}
  else if(d.addManual){
    const fields=[...document.querySelectorAll('#stage [data-field]')],question=fields[0].value.trim(),own=fields[1].value.trim(),answer=fields[2].value.trim(),title=fields[3].value.trim();
    if(!question||!answer||!title){announce('请填写题目、正确答案和知识点');return}
    const subject=document.getElementById('manual-subject').value;S.topic=TOPICS.length;TOPICS.push({subject,title,question,answer,own,hint:'复习时先独立作答，再核对答案。',steps:[['核对答案',answer]],prompts:['你会从哪里开始解这道题？'],checks:['.']});
    const x={id:'mistake-'+S.topic,type:'错题',topic:S.topic,subject,question,answer,explanation:answer,source:'手动录入',stage:0,due:1,mastered:false,removed:false,note:'',errors:1};MISTAKES.push(x);QUEUE.push(x);nav('S-14');announce('错题已保存，明天开始复习');
  }
  else if(d.masterMistake!==undefined){const x=MISTAKES.find(x=>x.topic===Number(d.masterMistake));x.mastered=!x.mastered;if(!x.mastered){x.stage=0;x.due=1}render();announce(x.mastered?'已标记掌握，退出到期复习':'已恢复复习，明天再次复习');}
  else if(d.removeMistake!==undefined){const x=MISTAKES.find(x=>x.topic===Number(d.removeMistake));x.removed=true;nav('S-13');const status=document.getElementById('status');clearTimeout(statusTimer);status.innerHTML=`已移出错题本 <button data-undo-mistake="${x.topic}">撤销</button>`;}
  else if(d.undoMistake!==undefined){MISTAKES.find(x=>x.topic===Number(d.undoMistake)).removed=false;document.getElementById('status').textContent='';render();}
  else if(d.saveNote){announce('笔记已保存');}
  else if(d.rateReview){const x=S.reviewSession[S.reviewCursor],rating=d.rateReview;if(!x)return;let days;
    if(rating==='忘记'){x.stage=0;days=1}else if(rating==='模糊')days=INTERVALS[x.stage];else if(x.stage===4){x.mastered=true;days=null}else{ x.stage++;days=INTERVALS[x.stage]; }
    x.due=days;S.reviewRatings.push({id:x.id,rating,days});S.reviewCursor++;nav(S.reviewCursor===S.reviewSession.length?'S-18':'S-17:正面');
  }
  else if(d.startPractice){nav('S-20:选择题');}
  else if(d.questionMove||d.questionJump!==undefined){S.exerciseIndex=d.questionJump!==undefined?Number(d.questionJump):S.exerciseIndex+Number(d.questionMove);S.handwritten=false;nav('S-20:'+exerciseQuestion().type);}
  else if (d.choice !== undefined) {
    const group=t.closest('[data-choice-group]'),key=group.dataset.choiceGroup,i=Number(d.choice),multiple=group.dataset.multiple==='true';
    const previous=S.choices[key]||[...group.querySelectorAll('[aria-pressed="true"]')].map(x=>Number(x.dataset.choice));
    S.choices[key]=multiple?(previous.includes(i)?previous.filter(x=>x!==i):[...previous,i]):[i];
    group.querySelectorAll('button').forEach((x,j)=>{const on=S.choices[key].includes(j);x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
  }
  else if (d.sendChat) sendChat(d.sendChat);
  else if (d.chatTopic !== undefined) { S.topic=Number(d.chatTopic);S.messages=[];S.guideStep=0;S.scrollChat=true;nav('S-01:'+ (S.chatMode==='direct'?'直接讲解':'引导式对话中')); }
  else if (d.chatAction) {
    const topic=TOPICS[S.topic];
    if(d.chatAction==='copy') { if(navigator.clipboard)navigator.clipboard.writeText(topic.steps.map(x=>x[1]).join('\n')).then(()=>announce('已复制解答')).catch(()=>announce('请选中解答文字复制'));else announce('请选中解答文字复制');return; }
    if(d.chatAction==='mistake'){nav('S-01:加入错题本弹窗');return;}
    if(!S.messages.length)S.messages=[{role:'user',text:topic.question},{role:'ai',text:topic.prompts[0]}];
    S.messages.push({role:'ai',text:d.chatAction==='full'?topic.steps.map(x=>x[0]+'：'+x[1]).join('\n'):d.chatAction==='example'?topic.hint:topic.steps[S.guideStep][1]});S.scrollChat=true;render();
  }
  else if (d.historyEdit !== undefined) {
    const item=HISTORY.find(x=>x.topic===Number(d.historyEdit)),dialog=document.createElement('dialog');dialog.className='answer-dialog';dialog.innerHTML=`<form method="dialog"><label class="lab" for="history-title">对话标题</label><input id="history-title" class="in" required maxlength="60" value="${escapeHTML(item.title)}"><div class="row"><button class="btn pri" value="save">保存标题</button><button class="btn" value="delete" formnovalidate>删除对话</button><button class="btn" value="cancel" formnovalidate>取消</button></div></form>`;
    document.body.append(dialog);dialog.addEventListener('close',()=>{if(dialog.returnValue==='save')item.title=dialog.querySelector('input').value.trim()||item.title;if(dialog.returnValue==='delete')item.deleted=true;dialog.remove();render();});dialog.showModal();
  }
  else if (d.saveProfile) {const field=document.querySelector(S.role==='s'?'#stage input[aria-label="昵称"]':'#stage input[aria-label="姓名"]');if(field){if(!field.value.trim()){field.focus();announce('请填写称呼');return}if(S.role==='s')S.profileName=field.value.trim();else S.teacherName=field.value.trim()}nav('C-04');announce('资料已保存');}
  else if (d.feedback) {const field=document.querySelector('#stage textarea');if(!field.value.trim()){field.focus();announce('请填写反馈内容');return}announce('反馈已记录在本次演示中');}
  else if (d.panel) { if(d.panel==='index')S.hideIndex=!S.hideIndex;else S.hideNotes=!S.hideNotes;render(); }
  else if (d.preview) { const hide=!(S.hideIndex&&S.hideNotes); S.hideIndex=hide;S.hideNotes=hide;render(); }
  else if (d.hwFilter !== undefined) { S.hwFilter=Number(d.hwFilter); render(); }
  else if (d.reviewStudent !== undefined) { S.reviewIndex=Number(d.reviewStudent); render(); }
  else if (d.saveReview !== undefined) {
    const i=Number(d.saveReview), field=document.getElementById('review-score-'+i);
    if (!field.value || !field.reportValidity()) { field.focus(); return; }
    REVIEW[i].score=Number(field.value); REVIEW[i].reviewed=true;
    if (d.nextReview) { const next=REVIEW.findIndex(x=>!x.reviewed); if (next<0) { nav('T-07:批改复核'); return; } S.reviewIndex=next; }
    render();
  }
  else if (d.publish) { S.publishTarget=d.publish; nav('T-07:发布确认'); }
  else if (d.confirmPublish) { (S.publishTarget==='all'?REVIEW:[REVIEW[S.reviewIndex]]).filter(x=>x.reviewed).forEach(x=>x.published=true); nav('T-07:已发布'); }
  else if (d.knowledge !== undefined) { S.knowledge=Number(d.knowledge); nav('T-18:知识点详情'); }
  else if (d.zoomAnswer) {
    const dialog=document.createElement('dialog');dialog.className='answer-dialog';dialog.innerHTML='<form method="dialog"><button class="btn">关闭作答大图</button></form>'+answerSheet(REVIEW[S.reviewIndex]);document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove());dialog.showModal();
  }
  else if (d.capture) {
    if (d.capture === '手写作答') { S.handwritten = true; S.exerciseAttachments[S.exerciseIndex]=true;if(!S.exerciseAnswers[S.exerciseIndex])S.exerciseAnswers[S.exerciseIndex]='已上传手写过程';nav('S-20:解答题'); }
    else { if (d.capture === '作业加页' && S.uploadPages < 10) S.uploadPages++; nav('S-11:预检通过'); }
  }
  else if (d.submitAnswer) {
    if(S.answerSource==='practice')for(let i=0;i<S.exerciseTotal;i++){
      const q=exerciseQuestion(i),answer=S.exerciseAnswers[i];if(q.type!=='选择题'||answer===q.correct)continue;
      const existing=MISTAKES.find(x=>x.question===q.q);
      if(existing){existing.errors++;existing.mastered=false;existing.removed=false;existing.stage=0;existing.due=1;continue;}
      const topic=TOPICS[S.exerciseTopic],index=TOPICS.length;TOPICS.push({...topic,question:q.q,answer:q.answer,own:answer===undefined?'未作答':q.options[answer],steps:[['参考解法',q.solution]],prompts:['先尝试列出你的解题思路。'],checks:['.']});
      const x={id:'mistake-'+index,type:'错题',topic:index,subject:topic.subject,question:q.q,answer:q.answer,explanation:q.solution,source:'练习',stage:0,due:1,mastered:false,removed:false,note:'',errors:1};MISTAKES.push(x);QUEUE.push(x);
    }
    nav(S.answerSource==='homework'?'S-10:已提交':'S-21:默认');
  }
  else if (d.go) { const card=t.closest('[data-mistake-topic]');if(card){S.topic=Number(card.dataset.mistakeTopic);if(d.go.startsWith('S-01')){S.messages=[];S.guideStep=0;}}
    if(d.registerRole)S.registerRole=d.registerRole; if (d.homework) S.homework=d.homework; else if (d.go==='S-10:未提交') S.homework='main'; nav(d.go); }
  else if (d.back) { const prev = S.stack.pop(); if (prev) nav(prev, false); }
  else if (d.state) { if(S.page==='S-01'&&['直接讲解','引导式对话中'].includes(d.state)){S.messages=[];S.chatMode=d.state==='直接讲解'?'direct':'guided';}S.state = d.state; render(); }
  else if (d.end) { S.end = d.end; const r = d.end[0]; if (r !== S.role) { S.role = r; S.page = r === 's' ? 'S-01' : 'T-01'; S.state = null; } render(); }
  else if (d.themeSet) { S.theme=d.themeSet;document.documentElement.dataset.theme = d.themeSet; render(); }
  else if (d.login) { S.exp = false; setRole(d.login); S.stack = []; nav(d.login === 's' ? 'S-01' : 'T-01', false); }
  else if (d.exp) { S.pendingRole = d.exp; nav('C-03:生成中'); }
  else if (d.expdone) { S.exp = true; setRole(S.pendingRole); S.stack = []; nav(S.pendingRole === 's' ? 'S-01:空状态' : 'T-01', false); }
  else if (d.switch) { const r = S.role === 's' ? 't' : 's'; setRole(r); S.stack = []; nav(r === 's' ? 'S-08' : 'T-07:批改复核', false); }
});
document.addEventListener('input', e => {
  const d=e.target.dataset;
  if(d.field)S.fields[d.field]=e.target.value;
  if(d.mistakeNote!==undefined)MISTAKES.find(x=>x.topic===Number(d.mistakeNote)).note=e.target.value;
  if(d.exerciseWritten)S.exerciseAnswers[S.exerciseIndex]=e.target.value;
  if(e.target.id==='chat-input') {S.chatDraft[S.role]=e.target.value;e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,112)+'px';}
  if(d.historySearch) {S.historySearch=e.target.value;let found=false;document.querySelectorAll('[data-history-row]').forEach(row=>{const item=HISTORY.find(x=>x.topic===Number(row.dataset.historyRow)),show=(item.title+TOPICS[item.topic].subject).includes(S.historySearch);row.hidden=!show;found ||= show});document.getElementById('history-empty').hidden=found;}
  if (d.reviewScore !== undefined) {
    const x=REVIEW[Number(d.reviewScore)]; x.score=e.target.value===''?null:Number(e.target.value); x.reviewed=false; x.published=false;
    document.querySelector(`[data-review-total="${d.reviewScore}"]`).textContent=x.score===null?'待给分':x.base+x.score;
  }
  if (d.reviewComment !== undefined) REVIEW[Number(d.reviewComment)].comment=e.target.value;
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(e.target.id==='expck'){S.exp=e.target.checked;render();}
  if(d.answer!==undefined){S.selectedAnswer=Number(d.answer);S.exerciseAnswers[S.exerciseIndex]=Number(d.answer);}
  if(d.mistakeFilter){S[d.mistakeFilter]=e.target.value;document.getElementById('mistake-results').innerHTML=mistakeList();}
  if(d.practiceSetting==='topic')S.practiceTopic=Number(e.target.value);
  if(d.practiceSetting==='count')S.practiceCount=Number(e.target.value);
  if(d.themeChoice){S.theme=e.target.value;document.documentElement.dataset.theme=S.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.theme;render();}
  if(d.reduceMotion){S.reduceMotion=e.target.checked;document.documentElement.dataset.reducedMotion=String(S.reduceMotion);}
  if(d.chatMode){S.chatMode=e.target.value;S.messages=[];S.guideStep=0;nav('S-01:'+(S.chatMode==='direct'?'直接讲解':'引导式对话中'));}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat(S.role);}
  else if(e.target.matches('[role="button"][data-go]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}
});

// 地址栏 #页面ID[:状态][@端]，例如 #T-08@tw，便于分享某一页
const [hashPage, hashEnd] = decodeURIComponent(location.hash.slice(1)).split('@');
if (ENDS[hashEnd]) { S.end = hashEnd; S.role = hashEnd[0]; }
if (hashPage && P[hashPage.split(':')[0]]) nav(hashPage, false); else render();
</script>

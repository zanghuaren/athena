<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雅典娜 · 低保真原型</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222; background: #e9e9e9; }
  button { font: inherit; cursor: pointer; }
  #app { display: grid; grid-template-columns: 230px 1fr 270px; height: 100vh; }
  #index, #notes { background: #fff; overflow-y: auto; padding: 12px; border-right: 1px solid #ccc; }
  #notes { border-right: 0; border-left: 1px solid #ccc; }
  #index h1 { font-size: 16px; margin: 0 0 8px; }
  .ends { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
  .ends button, .states button { border: 1px solid #999; background: #fff; padding: 4px; border-radius: 4px; font-size: 12px; }
  .ends button.on, .states button.on { background: #333; color: #fff; border-color: #333; }
  .exp { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 8px; }
  .group { font-size: 12px; color: #888; margin: 10px 0 2px; }
  .pl { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 3px 4px; border-radius: 3px; font-size: 13px; }
  .pl:hover { background: #eee; }
  .pl.on { background: #333; color: #fff; }
  .pl .id { display: inline-block; width: 38px; color: #999; font-size: 11px; }
  .pl.on .id { color: #ccc; }
  #stage { overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 24px; }
  #notes h2 { font-size: 15px; margin: 0 0 4px; }
  #notes .meta { font-size: 12px; color: #666; margin-bottom: 10px; }
  #notes p { margin: 6px 0; font-size: 13px; }
  .states { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 12px; }
  .q { background: #fff6d6; border: 1px dashed #c9a300; padding: 6px 8px; font-size: 12px; margin: 8px 0; border-radius: 4px; }

  /* 设备外壳 */
  .phone { width: 375px; height: 760px; background: #fff; border: 10px solid #333; border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; flex: none; }
  .web { width: 100%; min-width: 960px; max-width: 1280px; height: 760px; background: #fff; border: 1px solid #999; display: grid; grid-template-columns: 190px 1fr; overflow: hidden; }
  .full { flex: 1; overflow-y: auto; padding: 16px; }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ddd; min-height: 46px; }
  .topbar .t { flex: 1; font-weight: 600; text-align: center; }
  .web .topbar .t { text-align: left; }
  .content { flex: 1; overflow-y: auto; padding: 12px; }
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; border-top: 1px solid #ccc; }
  .tabs button { flex: 1; border: 0; background: #fff; padding: 8px 0 10px; font-size: 12px; color: #777; }
  .tabs button.on { color: #000; font-weight: 700; background: #eee; }
  .side { background: #f3f3f3; border-right: 1px solid #ccc; padding: 12px 8px; overflow-y: auto; }
  .side .logo { font-weight: 700; font-size: 16px; padding: 4px 8px 10px; }
  .side button.nav { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 4px; }
  .side button.nav.on { background: #333; color: #fff; }
  .side .sub { font-size: 12px; color: #888; padding: 10px 8px 4px; }
  .side .recent { font-size: 12px; padding: 4px 8px; color: #555; cursor: pointer; }
  .expbar { background: #ffe9a8; font-size: 12px; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; }
  .expbar button { border: 1px solid #a07c00; background: #fff; font-size: 12px; padding: 1px 6px; border-radius: 3px; }

  /* 通用线框组件 */
  .btn { border: 1px solid #555; background: #fff; padding: 6px 12px; border-radius: 4px; }
  .btn.pri { background: #333; color: #fff; border-color: #333; }
  .btn.block { display: block; width: 100%; margin: 8px 0; padding: 10px; }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  .btn.ghost { border-style: dashed; }
  .ico { border: 0; background: none; padding: 2px 6px; font-size: 13px; color: #333; text-decoration: underline; }
  .box { border: 1px solid #bbb; border-radius: 6px; padding: 10px; margin: 8px 0; background: #fff; }
  .box.gray { background: #f4f4f4; }
  .box.err { border: 1px dashed #d9822b; background: #fff3e6; }
  .ph { background: repeating-linear-gradient(45deg, #eee, #eee 8px, #e2e2e2 8px, #e2e2e2 16px); border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; border-radius: 4px; margin: 6px 0; }
  .in { border: 1px solid #aaa; border-radius: 4px; padding: 7px 8px; color: #999; margin: 4px 0; background: #fff; }
  .in.area { min-height: 70px; }
  .lab { font-size: 12px; color: #666; margin-top: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; }
  .muted { color: #888; font-size: 12px; }
  .h { font-weight: 700; margin: 12px 0 4px; }
  .big { font-size: 22px; font-weight: 700; }
  .chip { display: inline-block; border: 1px solid #999; border-radius: 12px; padding: 1px 9px; font-size: 12px; margin: 2px 2px 2px 0; background: #fff; }
  .chip.on { background: #333; color: #fff; border-color: #333; }
  .li { border-bottom: 1px solid #e5e5e5; padding: 9px 2px; cursor: pointer; }
  .li:hover { background: #fafafa; }
  .li .s { font-size: 12px; color: #888; }
  .seg { display: flex; border: 1px solid #555; border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .seg button { flex: 1; border: 0; background: #fff; padding: 5px; font-size: 13px; }
  .seg button.on { background: #333; color: #fff; }
  .bubble { max-width: 82%; padding: 8px 10px; border-radius: 8px; margin: 6px 0; }
  .bubble.me { margin-left: auto; background: #e6e6e6; }
  .bubble.ai { border: 1px solid #ccc; }
  .step { border-left: 3px solid #555; padding: 4px 8px; margin: 6px 0; background: #f7f7f7; }
  .step.dim { border-left-color: #ccc; color: #aaa; }
  .composer { border-top: 1px solid #ddd; padding: 8px 10px; }
  .bar { height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #555; }
  .kp { display: grid; grid-template-columns: 1fr 90px 60px; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid #eee; cursor: pointer; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { border: 1px solid #ccc; border-radius: 6px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid #e3e3e3; padding: 6px; text-align: left; }
  th { color: #666; font-weight: 600; background: #f6f6f6; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #fafafa; }
  .heat { display: grid; grid-template-columns: 120px repeat(6, 1fr); gap: 3px; font-size: 12px; align-items: center; }
  .heat i { display: block; height: 22px; border-radius: 2px; }
  .cols { display: grid; gap: 10px; height: 100%; }
  .mask { position: relative; }
  .modal { border: 2px solid #333; border-radius: 8px; padding: 12px; background: #fff; margin: 10px 0; box-shadow: 0 4px 18px rgba(0,0,0,.2); }
  .center { text-align: center; }
  .tag { font-size: 11px; border: 1px solid #888; border-radius: 3px; padding: 0 4px; color: #555; margin-left: 4px; }
  .ok { color: #2a7d2a; } .bad { color: #b33; } .warn { color: #b77900; }
</style>
</head>
<body>
<div id="app">
  <aside id="index"></aside>
  <main id="stage"></main>
  <aside id="notes"></aside>
</div>
<script>
// ───────────── 组件 ─────────────
const go = (id, label, cls = '') => `<button class="btn ${cls}" data-go="${id}">${label}</button>`;
const pri = (id, label, extra = '') => go(id, label, 'pri ' + extra);
const ico = (id, label) => `<button class="ico" data-go="${id}">${label}</button>`;
const ph = (label, h = 120) => `<div class="ph" style="height:${h}px">${label}</div>`;
const inp = (t, area) => `<div class="in ${area ? 'area' : ''}">${t}</div>`;
const lab = t => `<div class="lab">${t}</div>`;
const chips = (arr, on = 0) => arr.map((a, i) => `<span class="chip ${i === on ? 'on' : ''}">${a}</span>`).join('');
const seg = (arr, on = 0, gos = []) => `<div class="seg">${arr.map((a, i) => `<button class="${i === on ? 'on' : ''}" ${gos[i] ? `data-go="${gos[i]}"` : ''}>${a}</button>`).join('')}</div>`;
const li = (t, s, id) => `<div class="li" ${id ? `data-go="${id}"` : ''}><div>${t}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const box = (inner, cls = '') => `<div class="box ${cls}">${inner}</div>`;
const err = inner => box('⚠ ' + inner, 'err');
const h = t => `<div class="h">${t}</div>`;
const bar = v => `<div class="bar"><i style="width:${v}%"></i></div>`;
const stat = (v, t) => `<div class="stat"><b>${v}</b><span class="muted">${t}</span></div>`;
const kp = (name, v, id = 'S-24') => `<div class="kp" data-go="${id}"><span>${name}</span>${v == null ? '<span class="muted">·····</span>' : bar(v)}<span class="muted">${v == null ? '数据不足' : v + (v < 60 ? ' 薄弱' : v < 85 ? ' 一般' : ' 掌握')}</span></div>`;
const heatRow = (name, vals) => `<span>${name}</span>` + vals.map(v => `<i title="${v}" style="background:hsl(0,0%,${95 - v * 0.7}%)"></i>`).join('');
const steps = (arr, shown) => arr.map((s, i) => `<div class="step ${i >= shown ? 'dim' : ''}"><b>${i + 1} ${s[0]}</b><br>${i >= shown ? '（等待学生回应后展开）' : s[1]}</div>`).join('');
const composer = (tools = true) => `<div class="composer">${tools ? `<div class="row" style="margin-bottom:6px">${go('S-03:拍照答疑', '拍照答疑', 'sm')}${go('S-03:作业批改', '作业批改', 'sm')}<span class="muted">加分项：作文批改 · 口语对练</span></div>` : ''}<div class="row">${go('S-03:拍照答疑', '相机', 'sm')}<div class="in grow">输入你的学习问题……</div>${go('S-01:引导式对话中', '发送', 'sm pri')}</div></div>`;
const tbl = (head, rows, gos = []) => `<table><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map((r, i) => `<tr class="${gos[i] ? 'click' : ''}" ${gos[i] ? `data-go="${gos[i]}"` : ''}>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;

// ───────────── 页面 ─────────────
// role: c 公共 / s 学生 / t 教师；tab: 所属一级导航；req: 对应需求；webOnly: 教师手机端只读提示
const P = {};
const def = (id, o) => { P[id] = Object.assign({ id, states: { 默认: () => '' } }, o); };

// ── 公共 ──
def('C-01', { role: 'c', title: '登录', bare: true, req: 'ACC-02, ACC-04', states: {
  默认: () => login(''),
  密码错误: () => login(err('用户名或密码错误')),
  锁定: () => login(err('密码错误次数过多，请 10 分钟后再试')),
}});
function login(e) {
  return `<div class="center" style="margin-top:40px"><div class="big">雅典娜</div><div class="muted">连接学生和老师的 AI 学习助手</div></div>
  ${lab('用户名')}${inp('请输入用户名')}${lab('密码')}${inp('请输入密码')}${e}
  <button class="btn pri block" data-login="s">登 录（原型：以学生登录）</button>
  <button class="btn block" data-login="t">登 录（原型：以教师登录）</button>
  <div class="center muted">还没有账号？${ico('C-02', '去注册')}</div>
  <div class="center muted" style="margin:24px 0 8px">──── 免注册体验 ────</div>
  <div class="grid2"><button class="btn" data-exp="s">体验学生端</button><button class="btn" data-exp="t">体验教师端</button></div>`;
}
def('C-02', { role: 'c', title: '注册', bare: true, req: 'ACC-01', states: {
  选身份: () => `${ico('C-01', '← 返回登录')}<div class="big" style="margin:16px 0">选择你的身份</div>
    ${box('<b>我是学生</b><div class="muted">答疑、批改、错题复习、完成老师布置的作业</div>')}
    ${box('<b>我是老师</b><div class="muted">备课、组卷、布置和批改作业、查看学情</div>')}
    <div class="muted">身份注册后不能修改</div>${pri('C-02:填写账号', '下一步', 'block')}`,
  填写账号: () => `${ico('C-02:选身份', '← 上一步')}<div class="big" style="margin:16px 0">设置账号</div>
    ${lab('用户名（4～20 位字母、数字、下划线）')}${inp('')}${lab('密码（8～32 位，含字母和数字）')}${inp('')}${lab('确认密码')}${inp('')}
    ${pri('C-02:学生资料', '下一步（学生）', 'block')}${go('C-02:教师资料', '下一步（教师）', 'block')}`,
  用户名已存在: () => `${ico('C-02:选身份', '← 上一步')}<div class="big" style="margin:16px 0">设置账号</div>
    ${lab('用户名')}${inp('xiaoya2026')}${err('用户名已被使用')}${lab('密码')}${inp('••••••••')}${lab('确认密码')}${inp('••••••••')}${pri('C-02:学生资料', '下一步', 'block')}`,
  学生资料: () => `${ico('C-02:填写账号', '← 上一步')}<div class="big" style="margin:16px 0">完善资料</div>
    ${lab('昵称')}${inp('')}${lab('年级')}${chips(['七年级', '八年级', '九年级'], 1)}
    <div class="muted" style="margin-top:8px">不需要手机号，也不收集真实姓名</div><button class="btn pri block" data-login="s">完成注册</button>`,
  教师资料: () => `${ico('C-02:填写账号', '← 上一步')}<div class="big" style="margin:16px 0">完善资料</div>
    ${lab('姓名')}${inp('')}${lab('任教学科（可多选）')}${chips(['数学', '物理', '英语'], 0)}${lab('任教年级（可多选）')}${chips(['七年级', '八年级', '九年级'], 1)}
    <button class="btn pri block" data-login="t">完成注册</button>`,
}});
def('C-03', { role: 'c', title: '体验准备', bare: true, req: 'ACC-04', states: {
  生成中: () => `<div class="center" style="margin-top:80px"><div class="big">正在准备体验环境</div><div class="muted">为你生成一个班级和演示数据，约 5 秒</div></div>
    ${box(`<div class="ok">✓ 创建老师和学生账号</div><div class="ok">✓ 创建班级 八年级 3 班（30 名虚拟学生）</div><div>… 生成 3 次作业的提交与批改数据</div><div class="muted">○ 生成错题和学情数据</div>`)}
    <div class="muted">体验账号保留 7 天；体验中可以随时切换老师 / 学生视角</div><button class="btn pri block" data-expdone="1">完成（原型）</button>`,
  失败: () => `<div class="center" style="margin-top:80px"><div class="big">准备失败</div></div>${err('体验环境准备失败，请重试')}${go('C-03:生成中', '重试', 'pri block')}${go('C-01', '返回登录', 'block')}`,
}});
def('C-04', { role: 'c', title: '我的', tab: 'me', req: 'ME', states: { 默认: () => S.role === 's' ? `
  <div class="row"><div class="ph" style="width:56px;height:56px;border-radius:28px">头像</div><div class="grow"><b>小雅</b><div class="muted">八年级 · 已加入 2 个班级</div></div>${ico('C-05', '编辑')}</div>
  ${h('学习')}${li('我的班级', '八年级 3 班 数学 · 八年级 3 班 物理', 'S-25')}${li('学情画像', '平均掌握度 71', 'S-23')}${li('批改记录', '拍照批改过的作业', 'S-07')}${li('练习记录', '', 'S-22')}
  ${h('其他')}${li('设置', '主题、讲解方式、修改密码', 'C-06')}${li('帮助与反馈', '', 'C-07')}
  <div class="q">Q3 / Q5：按建议去掉了“历史记录”“我的收藏”，以及会员、教辅书架、隐私导出等旧入口</div>` : `
  <div class="row"><div class="ph" style="width:56px;height:56px;border-radius:28px">头像</div><div class="grow"><b>李老师</b><div class="muted">数学 · 八年级 · 3 个班级</div></div>${ico('C-05', '编辑')}</div>
  ${h('教学')}${li('我的班级', '', 'T-02')}${li('个人题库 <span class="tag">加分</span>', '', 'T-22')}
  ${h('其他')}${li('设置', '主题、修改密码', 'C-06')}${li('帮助与反馈', '', 'C-07')}` }});
def('C-05', { role: 'c', title: '编辑资料', back: true, req: 'ME-01', states: { 默认: () => `
  ${lab('头像（从预置头像中选）')}<div class="row">${ph('A', 44)}${ph('B', 44)}${ph('C', 44)}${ph('D', 44)}</div>
  ${S.role === 's' ? `${lab('昵称')}${inp('小雅')}${lab('年级')}${chips(['七年级', '八年级', '九年级'], 1)}<div class="q">Q6：学习阶段改为七 / 八 / 九年级</div>` : `${lab('姓名')}${inp('李明')}${lab('任教学科')}${chips(['数学', '物理', '英语'], 0)}${lab('任教年级')}${chips(['七年级', '八年级', '九年级'], 1)}`}
  ${go('C-04', '保存', 'pri block')}` }});
def('C-06', { role: 'c', title: '设置', back: true, req: 'ME-02～04', states: { 默认: () => `
  ${h('外观')}${seg(['纸感书房', '夜间自习', '跟随系统'], 2)}<div class="row between"><span>减少动态效果</span><span class="chip">关</span></div>
  ${S.role === 's' ? `${h('学习偏好')}${lab('讲解方式')}${seg(['引导式（默认）', '直接讲解'], 0)}<div class="q">Q2：旧设计有三种（循序引导 / 先看结论 / 举例理解），按建议只保留两种</div>${lab('常用学科')}${chips(['数学', '物理', '英语'], 0)}` : ''}
  ${h('账号')}${S.exp ? '<div class="muted">体验账号不能修改密码</div>' : li('修改密码', '需要输入原密码', '')}
  ${go('C-01', '退出登录', 'block')}` }});
def('C-07', { role: 'c', title: '帮助与反馈', back: true, req: 'ME-05', states: { 默认: () => `
  ${h('常见问题')}${li('▸ 引导式讲解和直接讲解有什么区别？')}${li('▸ 拍照批改识别不准怎么办？')}${li('▸ 错题什么时候会出现在复习里？')}
  ${h('隐私说明')}${box('老师能看到：你的班级内姓名、作业作答和成绩。<br>老师看不到：你的答疑记录、自主练习、拍照批改和复习记录。', 'gray')}
  ${h('意见反馈')}${inp('写下你的建议……', 1)}${go('C-07', '提交', 'sm')}
  <div class="muted" style="margin-top:12px">雅典娜 v0.1 · 挑战杯参赛作品</div>` }});
def('C-08', { role: 'c', title: '消息中心', back: true, bonus: true, req: 'MSG（加分）', states: { 默认: () => S.role === 's'
  ? li('● 新作业：二次根式练习', '八年级 3 班 · 今晚 20:00 截止', 'S-10') + li('● 批改结果已发布：浮力小测', '得分 86', 'S-12') + li('作业即将截止：Unit 3 阅读', '还剩 12 小时', 'S-10')
  : li('● 二次根式练习：AI 批改完成，35 份待复核', '', 'T-07') + li('浮力小测已截止：40/40 已交', '', 'T-07') }});

// ── 学生 ──

  const [id, st] = target.split(':');
  if (!P[id]) return;
  const p = P[id];
  if (push && S.page !== id) S.stack.push(S.page + ':' + S.state);
  if (p.role !== 'c' && p.role !== S.role) setRole(p.role);
  S.page = id; S.state = st || null;
  render();
}
function setRole(r) {
  S.role = r;
  if (r === 's' && !S.end.startsWith('s')) S.end = isPhone() ? 'sp' : 'sw';
  if (r === 't' && !S.end.startsWith('t')) S.end = isPhone() ? 'tp' : 'tw';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-back],[data-state],[data-end],[data-login],[data-exp],[data-expdone],[data-switch]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) nav(d.go);
  else if (d.back) { const prev = S.stack.pop(); if (prev) nav(prev, false); }
  else if (d.state) { S.state = d.state; render(); }
  else if (d.end) { S.end = d.end; const r = d.end[0]; if (r !== S.role) { S.role = r; S.page = r === 's' ? 'S-01' : 'T-01'; S.state = null; } render(); }
  else if (d.login) { S.exp = false; setRole(d.login); S.stack = []; nav(d.login === 's' ? 'S-01' : 'T-01', false); }
  else if (d.exp) { S.pendingRole = d.exp; nav('C-03:生成中'); }
  else if (d.expdone) { S.exp = true; setRole(S.pendingRole); S.stack = []; nav(S.pendingRole === 's' ? 'S-01:空状态' : 'T-01', false); }
  else if (d.switch) { const r = S.role === 's' ? 't' : 's'; setRole(r); S.stack = []; nav(r === 's' ? 'S-08' : 'T-07:批改复核', false); }
});
document.addEventListener('change', e => { if (e.target.id === 'expck') { S.exp = e.target.checked; render(); } });
// 地址栏 #页面ID[:状态][@端]，例如 #T-08@tw，便于分享某一页
const [hashPage, hashEnd] = decodeURIComponent(location.hash.slice(1)).split('@');
if (ENDS[hashEnd]) { S.end = hashEnd; S.role = hashEnd[0]; }
if (hashPage && P[hashPage.split(':')[0]]) nav(hashPage, false); else render();
</script>
